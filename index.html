<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>連携講座 第1回 アンケート</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fffaf3;--card:#fff;--ink:#2b2622;--sub:#7a6e63;--line:#eadfce;--main:#e8590c;--mainbg:#fff1dc;--ok:#2f9e44}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#27231f;--ink:#f3ece4;--sub:#b3a698;--line:#3d362f;--main:#ff922b;--mainbg:#3a2b1c;--ok:#69db7c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:8px 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.bar div{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--main);transition:width .25s}
.bar small{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.q{font-weight:700;margin:0 0 2px}
.q b{color:var(--main);margin-right:6px}
.why{color:var(--sub);font-size:12px;margin:0 0 10px}
.req{font-size:11px;color:#fff;background:var(--main);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 10px 38px;position:relative;font-size:15px}
.opt span::before{content:"";position:absolute;left:12px;top:50%;width:16px;height:16px;margin-top:-8px;border:1.5px solid var(--sub);border-radius:50%}
.multi .opt span::before{border-radius:4px}
.opt input:checked+span{border-color:var(--main);background:var(--mainbg)}
.opt input:checked+span::before{background:var(--main);border-color:var(--main)}
.multi .opt input:checked+span::after{content:"✓";position:absolute;left:14px;top:50%;margin-top:-11px;color:#fff;font-size:13px;font-weight:700}
.opt input:focus-visible+span{outline:2px solid var(--main);outline-offset:2px}
.opt input:disabled+span{opacity:.45}
.scale{display:flex;gap:8px}
.scale .opt{flex:1}
.scale .opt span{padding:12px 0;text-align:center;font-size:18px;font-weight:700}
.scale .opt span::before{display:none}
.ends{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:4px}
input[type=text],textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--main);border-color:var(--main)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.err{color:#e03131;font-size:13px;margin-top:6px;display:none}
.card.bad{border-color:#e03131}.card.bad .err{display:block}
button{width:100%;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--main);border:0;border-radius:12px;padding:14px;cursor:pointer;margin-top:8px}
button:disabled{opacity:.6}
.done{text-align:center;padding:40px 8px}
.done h2{font-size:22px;margin:0 0 8px}
.done .mark{font-size:48px;color:var(--ok)}
.cnt{font-size:12px;color:var(--sub);float:right}
</style>
</head>
<body>
<div class="wrap">
  <div id="formArea">
    <h1>連携講座 第1回 アンケート</h1>
    <p class="lead">所要 約2分。いただいた回答は、第1回の資料の見直しと、第2回・第3回の内容づくりに使います。</p>
    <div class="bar"><div><i id="prog"></i></div><small id="progTxt"></small></div>
    <form id="f" novalidate>
      <div class="card" data-id="name">
        <p class="q">お名前（会社名・お店の名前でもOK）<span class="req">必須</span></p>
        <p class="why">個別にフォローするときのため。ほかの参加者には見えません</p>
        <input type="text" name="name" maxlength="60" autocomplete="name">
        <div class="err">入力してください</div>
      </div>
      <div id="qs"></div>
      <div class="hp" aria-hidden="true"><input type="text" name="hp" tabindex="-1" autocomplete="off"></div>
      <button id="send" type="submit">送信する</button>
      <p class="lead" id="msg" style="text-align:center"></p>
    </form>
  </div>
  <div id="doneArea" class="done" hidden>
    <div class="mark">✓</div>
    <h2>ご回答ありがとうございました</h2>
    <p class="lead">夜遅くまでおつかれさまでした。<br>回答は次回の講座づくりに活かします。</p>
  </div>
</div>
<script>
const CONFIG = { GAS_URL: "https://script.google.com/macros/s/AKfycbyEBnVDlJrWFn8lbmjSraStGguExjYDrZXhLFquqvalKZ-1M_GidxLBsjqp3Lc6A-gaIw/exec" };
const QUESTIONS = [{"id":"os","no":1,"type":"single","label":"お使いのパソコンは？","why":"次回から Mac用・Windows用の手順を分けて用意するため","options":["Windows","Mac","スマホ・タブレットだけ"]},{"id":"exp","no":2,"type":"single","label":"今日より前の、AI（ChatGPT・Claudeなど）の使い方は？","why":"レベル別にフォローを変えるため","options":["ほぼ使ったことがない","たまに質問に使う程度","仕事で毎日使っている","コードやフォルダ連携まで触ったことがある"]},{"id":"done","no":3,"type":"multi","label":"今日、できたものを全部選んでください","why":"どこで止まる人が多いか（脱落ポイント）を数字で見るため","options":["Chrome に Claude 拡張機能を入れた","Claude のデスクトップアプリ（コード）を使えた","GitHub とつながった","Google ドライブ／スプレッドシートとつながった","予約フォームを作れた","ウェブに公開できた（URLで開ける）","予約がスプレッドシートに入るのを確認できた","途中で止まって、ここまでいけなかった"]},{"id":"stuck","no":4,"type":"multi","label":"つまずいたところを選んでください（複数OK）","why":"第1回の資料と、補習の内容を直すため","options":["アプリ・拡張機能のインストール","画面を左右に分ける操作","ログイン・アカウントの選択","コネクタ（連携）の接続","コードと拡張機能の使い分け","許可・承認画面の進め方","プロンプト（指示文）の書き方","専門用語が分からない","Zoom・画面共有の操作","特につまずかなかった"]},{"id":"pace","no":5,"type":"single","label":"進むスピードはどうでしたか？","why":"次回の進行ペースと、サポート人数を決めるため","options":["速くて追えなかった","やや速かった","ちょうどよかった","もっと速くていい"]},{"id":"useful","no":6,"type":"scale","label":"今日の講座は、仕事に役立ちそうですか？","why":"満足度の推移を第2回・第3回と比べるため","min":1,"max":5,"minLabel":"あまり","maxLabel":"とても"},{"id":"next","no":7,"type":"multi","max":3,"label":"次回以降にやりたいこと（最大3つ）","why":"第2回・第3回の内容を、要望の多い順に決めるため","options":["自社ホームページの作成","予約フォームの作り込み（自社用）","予約データの分析レポート","請求書・報酬計算の自動化","口コミ・リピート客への自動配信","ブログ・マップ投稿の下書き","動画づくり（BSCAIなど）","スタッフ管理・日報・シフト","AIの基本の使い方（プロンプト）","今日の復習（補習）をしっかり"]},{"id":"style","no":8,"type":"single","label":"次回までの、希望のスタイルは？","why":"補習の会を開くか、本編に進むかを決めるため","options":["今日の続きを個別に見てほしい","補習（復習）の会に出たい","第1回をもう一度受けたい","次回の本編からそのまま参加できる","録画を見て、自分で進められる"]},{"id":"time","no":9,"type":"single","label":"参加しやすい時間帯は？","why":"次回の開催日時を決めるため","options":["平日の昼","平日の夜（20時〜）","土日の昼","土日の夜"]},{"id":"free","no":10,"type":"text","label":"何でもできる「神」になったら、ご自分の仕事で、最初に何を自動化・実現したいですか？","why":"具体的な悩みを、第2回・第3回の題材にするため","placeholder":"例：予約が入ったらお礼メールが自動で届く／月末の請求書が勝手にできる／スタッフの稼働を一目で見たい"}];
const KEY = "renkei-survey-1-done";
const qs = document.getElementById("qs");

QUESTIONS.forEach(q => {
  const c = document.createElement("div");
  c.className = "card"; c.dataset.id = q.id;
  let h = '<p class="q"><b>Q' + q.no + '</b>' + q.label + '<span class="req">' + (q.type==="text" ? "任意" : "必須") + '</span>' +
    (q.max ? '<span class="cnt" id="cnt-' + q.id + '"></span>' : '') + '</p><p class="why">' + q.why + '</p>';
  if (q.type === "text") {
    h += '<textarea name="' + q.id + '" maxlength="1000" placeholder="' + (q.placeholder||"") + '"></textarea>';
  } else if (q.type === "scale") {
    h += '<div class="scale">';
    for (let n = q.min; n <= q.max; n++) h += '<label class="opt"><input type="radio" name="' + q.id + '" value="' + n + '"><span>' + n + '</span></label>';
    h += '</div><div class="ends"><span>' + q.minLabel + '</span><span>' + q.maxLabel + '</span></div>';
  } else {
    const t = q.type === "multi" ? "checkbox" : "radio";
    h += '<div class="opts ' + (t==="checkbox"?"multi":"") + '">' + q.options.map(o =>
      '<label class="opt"><input type="' + t + '" name="' + q.id + '" value="' + o + '"><span>' + o + '</span></label>').join("") + '</div>';
  }
  c.innerHTML = h + '<div class="err">' + (q.type==="multi" ? "1つ以上選んでください" : "選んでください") + '</div>';
  qs.appendChild(c);
});

const f = document.getElementById("f");
function val(q) {
  if (q.type === "multi") return [...f.querySelectorAll('input[name="' + q.id + '"]:checked')].map(x => x.value);
  if (q.type === "text") return f.elements[q.id].value.trim();
  const r = f.querySelector('input[name="' + q.id + '"]:checked'); return r ? r.value : "";
}
function filled(q) { const v = val(q); return q.type === "text" || (Array.isArray(v) ? v.length > 0 : v !== ""); }
function update() {
  QUESTIONS.filter(q => q.max).forEach(q => {
    const n = val(q).length;
    document.getElementById("cnt-" + q.id).textContent = n + "/" + q.max;
    f.querySelectorAll('input[name="' + q.id + '"]').forEach(i => { i.disabled = !i.checked && n >= q.max; });
  });
  const need = QUESTIONS.filter(q => q.type !== "text");
  const n = need.filter(filled).length + (f.elements.name.value.trim() ? 1 : 0);
  const tot = need.length + 1;
  document.getElementById("prog").style.width = (n / tot * 100) + "%";
  document.getElementById("progTxt").textContent = "回答済み " + n + " / " + tot;
}
f.addEventListener("input", update); f.addEventListener("change", update); update();

f.addEventListener("submit", async e => {
  e.preventDefault();
  let first = null;
  const mark = (id, bad) => { const c = f.querySelector('.card[data-id="' + id + '"]'); c.classList.toggle("bad", bad); if (bad && !first) first = c; };
  mark("name", !f.elements.name.value.trim());
  QUESTIONS.forEach(q => mark(q.id, q.type !== "text" && !filled(q)));
  if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const body = { name: f.elements.name.value.trim(), hp: f.elements.hp.value };
  QUESTIONS.forEach(q => body[q.id] = val(q));
  const btn = document.getElementById("send"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "送信中…"; msg.textContent = "";
  try {
    // 返事は読めない設定（no-cors）。送信が通信エラーにならなければ受付とみなす
    await fetch(CONFIG.GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    try { localStorage.setItem(KEY, "1"); } catch (x) {}
    show();
  } catch (err) {
    btn.disabled = false; btn.textContent = "送信する";
    msg.textContent = "送信できませんでした。電波を確認して、もう一度押してください。";
  }
});
function show() { document.getElementById("formArea").hidden = true; document.getElementById("doneArea").hidden = false; window.scrollTo(0, 0); }
try { if (localStorage.getItem(KEY) && location.hash !== "#again") show(); } catch (x) {}
</script>
</body>
</html>
