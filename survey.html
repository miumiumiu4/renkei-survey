<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>連携講座 アンケート</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#fffaf3;--card:#fff;--ink:#2b2622;--sub:#7a6e63;--line:#eadfce;--main:#e8590c;--mainbg:#fff1dc;--ok:#2f9e44}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--card:#27231f;--ink:#f3ece4;--sub:#b3a698;--line:#3d362f;--main:#ff922b;--mainbg:#3a2b1c;--ok:#69db7c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:8px 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.bar div{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--main);transition:width .25s}
.bar small{color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.sect{font-weight:700;color:var(--main);margin:26px 0 0;font-size:15px}
.q{font-weight:700;margin:0 0 2px}
.q b{color:var(--main);margin-right:6px}
.why{color:var(--sub);font-size:12px;margin:0 0 10px}
.req{font-size:11px;color:#fff;background:var(--main);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.req.o{background:var(--sub)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 10px 38px;position:relative;font-size:15px}
.opt span::before{content:"";position:absolute;left:12px;top:50%;width:16px;height:16px;margin-top:-8px;border:1.5px solid var(--sub);border-radius:50%}
.multi .opt span::before{border-radius:4px}
.opt input:checked+span{border-color:var(--main);background:var(--mainbg)}
.opt input:checked+span::before{background:var(--main);border-color:var(--main)}
.multi .opt input:checked+span::after{content:"✓";position:absolute;left:14px;top:50%;margin-top:-11px;color:#fff;font-size:13px;font-weight:700}
.opt input:focus-visible+span{outline:2px solid var(--main);outline-offset:2px}
.opt input:disabled+span{opacity:.45}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale .opt{flex:1;min-width:40px}
.scale .opt span{padding:12px 0;text-align:center;font-size:17px;font-weight:700}
.scale .opt span::before{display:none}
.ends{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-top:4px}
input[type=text],input[type=email],textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--main);border-color:var(--main)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.err{color:#e03131;font-size:13px;margin-top:6px;display:none}
.card.bad{border-color:#e03131}.card.bad .err{display:block}
button{width:100%;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--main);border:0;border-radius:12px;padding:14px;cursor:pointer;margin-top:8px}
button:disabled{opacity:.6}
.done{text-align:center;padding:40px 8px}
.done h2{font-size:22px;margin:0 0 8px}
.done .mark{font-size:48px;color:var(--ok)}
.cnt{font-size:12px;color:var(--sub);float:right}
.sum{text-align:left;margin-top:24px}
.sum h3{font-size:17px;margin:22px 0 6px;color:var(--main)}
.sum ol,.sum ul{margin:0;padding-left:1.4em}
.sum li{margin:6px 0}
.sum .box{background:var(--mainbg);border-radius:12px;padding:12px 14px;margin-top:8px}
.sum code{background:var(--mainbg);border-radius:4px;padding:0 4px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div id="formArea">
    <h1 id="ttl"></h1>
    <p class="lead" id="lead"></p>
    <div class="bar"><div><i id="prog"></i></div><small id="progTxt"></small></div>
    <form id="f" novalidate>
      <div id="idn"></div>
      <div id="qs"></div>
      <div class="hp" aria-hidden="true"><input type="text" name="hp" tabindex="-1" autocomplete="off"></div>
      <button id="send" type="submit">送信する</button>
      <p class="lead" id="msg" style="text-align:center"></p>
    </form>
  </div>
  <div id="doneArea" class="done" hidden>
    <div class="mark">✓</div>
    <h2>ご回答ありがとうございました</h2>
    <p class="lead">回答は、次回の講座づくりに活かします。</p>
    <div id="thanksExtra"></div>
  </div>
</div>
<template id="thanks-summary1">
    <div class="sum card">
      <h2 style="font-size:19px;margin:0">今日（第1回）のまとめ</h2>
      <p class="lead" style="margin:4px 0 0">回答してくれた方だけに表示しています。</p>
      <h3>今日の流れ</h3>
      <ol>
        <li><b>準備</b>：Google Chrome と Claude のデスクトップアプリを入れる。ChromeにはウェブストアでClaude拡張機能を追加。Chrome と Claude は同じGoogleアカウントでログイン。画面は左右半分ずつに分ける（Windows：Windowsキー＋←）。</li>
        <li><b>GitHub と連携</b>：Claude「コード」に「Chromeでギットハブ連携させるので、プロンプトを書いて」と入力 → 出たプロンプトをコピーして拡張機能に貼る → 「Googleで続行」→ 承認。</li>
        <li><b>Googleドライブ／スプレッドシートと連携</b>：Claudeの設定の「コネクタ」から接続（権限はすべて選択、ツールは「常に許可」）。つながったか確認するには「スプレッドシートで売上管理表を作って」と頼む。</li>
        <li><b>予約フォームを作る</b>：見本のリンクをコードに貼り、「これをベンチマークした予約フォームをガス連携して作ってください」。続けて「GitHubでウェブに公開してください」。</li>
        <li><b>予約がスプレッドシートに入るか確認</b>：公開されたURLでテスト予約し、スプレッドシートに行が入ればOK。</li>
      </ol>
      <h3>詰まったときの合言葉</h3>
      <ul>
        <li>次に何をするか分からなくなったら、拡張機能に「この先どうやって進めていいかわからない」。</li>
        <li>エラー画面は、スクショを撮ってClaudeに貼り付けて「これを解決して」。</li>
        <li>「できません」ではなく「<b>これを解決するプロンプトを書いて。コードと拡張機能のどちらに打てばいい？</b>も教えて」と聞く。</li>
        <li>許可・承認画面が出たら、「詳細」→「安全ではないページに移動」→「すべて選択」→「許可」。</li>
        <li>入力欄でTabキーを押すと、Claudeの提案文が自動で入る。</li>
        <li>AIには遠慮せず、王様のつもりで、どんどん命令する。</li>
        <li>作業中は、ブラウザを開きすぎない（Claude・コード・Chromeを1つずつ）。</li>
      </ul>
      <h3>次回までの宿題</h3>
      <div class="box">
        <ol>
          <li>予約フォームを<b>自分の会社用に作り込む</b>（サービス・料金・支払い方法・会社名）。</li>
          <li>自社ホームページの予約ボタンに、そのURLを貼る。</li>
          <li>「この予約フォームのスプレッドシートを見て、業務改善の分析レポートをGitHubで作って。リアルタイム更新にして」と頼んでみる。</li>
          <li>今日の途中で止まった方は、補習の会または第1回の再受講へ（アンケートの希望をもとに案内します）。</li>
        </ol>
      </div>
    </div>
</template>

    h += '</div><div class="ends"><span>' + esc(q.minLabel) + '</span><span>' + esc(q.maxLabel) + '</span></div>';
  } else {
    const t = q.type === "multi" ? "checkbox" : "radio";
    h += '<div class="opts ' + (t === "checkbox" ? "multi" : "") + '">' + q.options.map(o =>
      '<label class="opt"><input type="' + t + '" name="' + q.id + '" value="' + esc(o) + '"><span>' + esc(o) + '</span></label>').join("") + '</div>';
  }
  c.innerHTML = h + '<div class="err">' + (q.type === "multi" ? "1つ以上選んでください" : "選んでください") + '</div>';
  qs.appendChild(c);
});

function val(q) {
  if (q.type === "multi") return [...f.querySelectorAll('input[name="' + q.id + '"]:checked')].map(x => x.value);
  if (q.type === "text") return f.elements[q.id].value.trim();
  const r = f.querySelector('input[name="' + q.id + '"]:checked'); return r ? r.value : "";
}
const filled = q => { const v = val(q); return Array.isArray(v) ? v.length > 0 : v !== ""; };
const reqQs = SV.questions.filter(q => q.req);
function update(e) {
  // 「特になし」「止まった」など、他と一緒に選べない項目
  if (e && e.target && e.target.type === "checkbox" && e.target.checked) {
    const q = SV.questions.find(x => x.id === e.target.name);
    if (q && q.exclusive) {
      const ex = q.exclusive.includes(e.target.value);
      f.querySelectorAll('input[name="' + q.id + '"]').forEach(i => { if (i !== e.target && (ex || q.exclusive.includes(i.value))) i.checked = false; });
    }
  }
  SV.questions.filter(q => q.max).forEach(q => {
    const n = val(q).length;
    document.getElementById("cnt-" + q.id).textContent = n + "/" + q.max;
    f.querySelectorAll('input[name="' + q.id + '"]').forEach(i => { i.disabled = !i.checked && n >= q.max; });
  });
  let n = reqQs.filter(filled).length + (f.elements.name.value.trim() ? 1 : 0) + (idn.email && f.elements.email.value.trim() ? 1 : 0);
  const tot = reqQs.length + 1 + (idn.email ? 1 : 0);
  document.getElementById("prog").style.width = (n / tot * 100) + "%";
  document.getElementById("progTxt").textContent = "必須の回答 " + n + " / " + tot;
}
f.addEventListener("input", update); f.addEventListener("change", update); update();

const sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).slice(0, 36);
f.addEventListener("submit", async e => {
  e.preventDefault();
  let first = null;
  const mark = (id, bad) => { const c = f.querySelector('.card[data-id="' + id + '"]'); if (!c) return; c.classList.toggle("bad", bad); if (bad && !first) first = c; };
  mark("name", !f.elements.name.value.trim());
  if (idn.email) mark("email", !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.elements.email.value.trim()));
  SV.questions.forEach(q => mark(q.id, q.req && !filled(q)));
  if (first) { first.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const a = {}; SV.questions.forEach(q => a[q.id] = val(q));
  const body = { survey: SID, sid, name: f.elements.name.value.trim(), email: idn.email ? f.elements.email.value.trim() : "", company: idn.company ? f.elements.company.value.trim() : "", a, hp: f.elements.hp.value };
  const btn = document.getElementById("send"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "送信中…"; msg.textContent = "";
  try {
    const r = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "ng");
    try { localStorage.setItem(KEY, "1"); } catch (x) {}
    show();
  } catch (err) {
    btn.disabled = false; btn.textContent = "送信する";
    msg.textContent = "送信できませんでした。電波を確認して、もう一度押してください（二重に送られることはありません）。";
  }
});
function show() {
  document.getElementById("formArea").hidden = true; document.getElementById("doneArea").hidden = false;
  if (SV.thanks) { const t = document.getElementById("thanks-" + SV.thanks); if (t) document.getElementById("thanksExtra").appendChild(t.content.cloneNode(true)); }
  window.scrollTo(0, 0);
}
try { if (localStorage.getItem(KEY) && location.hash !== "#again") show(); } catch (x) {}
</script>
</body>
